name: deploy-websites

# Re-uploads both Cloudflare Workers whenever their code (or the shared web/
# files the studio serves) changes on main. Tests must pass first.
on:
  push:
    branches: [main]
    paths:
      - "workers/**"
      - "web/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-websites
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    if: vars.SURF_FRAME_READY == 'true'     # set this repository variable once set up
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # A separate environment, restricted to main, holds the only secret that can
    # change the websites. The render job never sees it.
    environment: cloudflare-deploy
    strategy:
      max-parallel: 1
      matrix:
        worker: [frame-img, studio]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # UNVERIFIED: wrangler major version current as of my knowledge. Deploying
      # keeps the Worker's existing secrets (DEVICE_TOKEN, GH_TOKEN) and Access setting.
      - name: Deploy ${{ matrix.worker }}
        working-directory: workers/${{ matrix.worker }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
